[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
use-bold=no
prompt="› "
placeholder=Search applications
icons-enabled=no
fields=filename,name,generic,keywords
match-mode=fzf
sort-result=yes
match-counter=no
show-actions=no
terminal=kitty -e {cmd}
anchor=center
lines=8
width=42
horizontal-pad=12
vertical-pad=8
inner-pad=6
line-height=24
letter-spacing=0
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes
enable-mouse=yes

[colors]
background=101315fa
text=cacccccf
prompt=798186ff
placeholder=565d60ff
input=caccccff
match=de6145ff
selection=343d41ff
selection-text=caccccff
selection-match=de6145ff
counter=565d60ff
border=bcc0c2ff

[border]
width=1
radius=0
selection-radius=0
