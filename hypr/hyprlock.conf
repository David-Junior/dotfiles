$background = rgba(16, 19, 21, 1.0)
$surface = rgba(16, 19, 21, 0.94)
$border = rgba(121, 129, 134, 1.0)
$foreground = rgba(202, 204, 204, 1.0)
$muted = rgba(202, 204, 204, 0.7)
$checking = rgba(52, 61, 65, 1.0)
$critical = rgba(222, 97, 69, 1.0)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fail_timeout = 1500
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = solitude, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, solitude
    animation = fadeOut, 1, 4, solitude
    animation = inputFieldColors, 1, 3, solitude
    animation = inputFieldDots, 1, 3, solitude
}

background {
    monitor =
    path = ~/.config/hypr/backgrounds/solitude-BG1.png
    color = $background
    blur_passes = 1
    blur_size = 3
    noise = 0.006
    contrast = 0.92
    brightness = 0.56
    vibrancy = 0.0
}

# Time
label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 72
    font_family = $font
    position = 0, 115
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A  ·  %d %B"
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 320, 42
    outline_thickness = 1
    outer_color = $border
    inner_color = $surface
    check_color = $checking
    fail_color = $critical
    font_color = $foreground
    font_family = $font
    font_size = 12
    placeholder_text = <span foreground="##caccccaa">password</span>
    check_text = authenticating
    fail_text = $PAMFAIL
    rounding = 0
    dots_rounding = 0
    dots_size = 0.18
    dots_spacing = 0.28
    fade_on_empty = false
    position = 0, -25
    halign = center
    valign = center
}

# Session identity
label {
    monitor =
    text = $USER
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, -65
    halign = center
    valign = center
}

# Keyboard layout
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 10
    font_family = $font
    position = -24, 20
    halign = right
    valign = bottom
    onclick = hyprctl switchxkblayout all next
}
